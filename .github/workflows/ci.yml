name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - run: ruff check src/ tests/

      # Integration tests need a sibling hansard-pm-nlp checkout for real
      # data; they self-skip via the sibling_repo_available fixture when
      # it's absent, which it is in CI. Unit tests still run and must pass.
      - run: pytest tests/ -v
